<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Outubro do Theo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Young+Serif&amp;display=swap">
<style>
body{margin:0}
a{color:#C9CEE3}a:hover{color:#FFFFFF}
.dn{position:absolute;left:0;top:6px;width:28px;font-size:12px;line-height:14px;color:#A9B0CC;text-align:right;font-variant-numeric:tabular-nums}
.base{position:absolute;left:44px;right:0;height:1px;opacity:.25}
.seg{position:absolute;height:2.4px;border-radius:2px}
.g{position:absolute;width:10px;height:10px;box-sizing:border-box}
.g-crise::before,.g-crise::after{content:"";position:absolute;left:3.8px;top:-1px;width:2.4px;height:12px;border-radius:2px;background:currentColor;transform:rotate(45deg)}
.g-crise::after{transform:rotate(-45deg)}
.g-conq::before{content:"";position:absolute;left:1.5px;top:1.5px;width:7px;height:7px;background:currentColor;transform:rotate(45deg);border-radius:1px}
.g-func{border:2px solid currentColor;border-radius:50%}
.g-sono::before{content:"";position:absolute;left:-3px;right:-3px;top:3.5px;height:3px;border-radius:2px;background:currentColor}
.g-sonoruim::before,.g-sonoruim::after{content:"";position:absolute;top:3.5px;width:6px;height:3px;border-radius:2px;background:currentColor}
.g-sonoruim::before{left:-3px}.g-sonoruim::after{right:-3px}
.g-comida::before,.g-comida::after{content:"";position:absolute;top:2.75px;width:4.5px;height:4.5px;border-radius:50%;background:currentColor}
.g-comida::before{left:0}.g-comida::after{right:0}
.g-nota::before{content:"";position:absolute;left:4px;top:0;width:2px;height:10px;border-radius:1px;background:currentColor}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; background: #1C2238; color: #F3F4F8; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; padding: 80px 88px; display: flex; flex-direction: column; gap: 44px; overflow: hidden">

<div>
<h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 92px; line-height: 1; letter-spacing: -0.015em">Outubro do Theo</h1>
<p style="margin: 18px 0 0; font-size: 28px; line-height: 1.3; color: #C9CEE3">{{total}} pontos, tecidos por quatro pessoas que cuidam dele.</p>
</div>

<div role="img" aria-label="Trama do mês de outubro: uma faixa por dia, uma linha por pessoa. As noites ruins e as crises ficam mais raras no fim do mês, e as conquistas ficam mais frequentes." style="position: relative; width: 904px; height: 806px; flex-shrink: 0">
<sc-for list="{{warps}}" as="w" hint-placeholder-count="9">
<div style="position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255, 255, 255, 0.05); left: {{w.left}}px"></div>
</sc-for>
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="31">
<div style="position: relative; height: 26px; flex-shrink: 0">
<span class="dn">{{r.n}}</span>
<sc-for list="{{r.bases}}" as="b" hint-placeholder-count="4">
<div class="base" style="top: {{b.top}}px; background: {{b.color}}"></div>
</sc-for>
<sc-for list="{{r.segs}}" as="s" hint-placeholder-count="5">
<div class="seg" style="left: {{s.left}}px; width: {{s.w}}px; top: {{s.top}}px; background: {{s.color}}"></div>
</sc-for>
<sc-for list="{{r.stitches}}" as="g" hint-placeholder-count="6">
<span class="{{g.cls}}" style="left: {{g.left}}px; top: {{g.top}}px; color: {{g.color}}"></span>
</sc-for>
</div>
</sc-for>
</div>
</div>

<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 40px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 40px; font-size: 20px; color: #DDE1EE">
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 30px; height: 4px; border-radius: 2px; background: #E8678C"></span>Ana, mãe</div>
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 30px; height: 4px; border-radius: 2px; background: #6E8BFF"></span>Júlia, professora</div>
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 30px; height: 4px; border-radius: 2px; background: #F2B33D"></span>Rafa, fono</div>
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 30px; height: 4px; border-radius: 2px; background: #4CC392"></span>Cida, avó</div>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px; text-align: right">
<span style="font-family: 'Young Serif', Georgia, serif; font-size: 30px">Feito no Trama</span>
<span style="font-size: 18px; color: #A9B0CC">Nenhum registro aparece aqui. Só a trama.</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"seed":{"editor":"int","default":7,"min":1,"max":99,"section":"Trama"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    let a = (this.props.seed ?? 7) * 2654435761;
    const R = () => {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
    const COLORS = ['#E8678C', '#6E8BFF', '#F2B33D', '#4CC392'];
    const LANE = [5, 11, 17, 23];
    const X = (h) => 44 + (h - 6) * 53.75;
    const r1 = (v) => Math.round(v * 10) / 10;
    const rows = [];
    let total = 0;
    for (let d = 1; d <= 31; d++) {
      const wd = (3 + d - 1) % 7;
      const weekend = wd >= 5;
      const t = (d - 1) / 30;
      const segs = [];
      const stitches = [];
      const seg = (l, h1, h2) => segs.push({ left: r1(X(h1)), w: r1(X(h2) - X(h1)), top: LANE[l] - 1.2, color: COLORS[l] });
      const st = (l, h, type) => stitches.push({ cls: 'g g-' + type, left: r1(X(h) - 5), top: LANE[l] - 5, color: COLORS[l] });

      if (wd === 5) { seg(0, 6, 9); seg(0, 17, 22); seg(3, 9, 17); }
      else if (wd === 6) { seg(0, 6, 22); seg(3, 10, 13); }
      else { seg(0, 6, 7.75); seg(0, 17.5, 22); seg(1, 8, 12.5); seg(3, 13, 17.5); }
      if (wd === 0 || wd === 2) seg(2, 14, 15);
      if (wd === 4) seg(2, 15, 16);

      const bad = R() < 0.42 - 0.30 * t;
      st(0, 6.3 + R() * 0.4, bad ? 'sonoruim' : 'sono');

      if (!weekend) {
        if (bad && R() < 0.8) st(1, 9 + R() * 2.5, 'crise');
        else if (R() < 0.06) st(1, 9 + R() * 3, 'crise');
        if (R() < 0.35 + 0.2 * t) st(1, 8.5 + R() * 3.5, 'func');
        if (R() < 0.15 + 0.45 * t) st(1, 8.5 + R() * 3.5, 'conq');
        if (R() < 0.7) st(3, 15 + R(), 'comida');
        if (R() < 0.25) st(3, 13.5 + R() * 3.5, 'nota');
        if (R() < 0.1 + 0.3 * t) st(3, 13.5 + R() * 3.5, 'conq');
      }
      if (wd === 0 || wd === 2) st(2, 14.5, R() < 0.3 + 0.5 * t ? 'conq' : 'func');
      if (wd === 4) st(2, 15.5, R() < 0.3 + 0.5 * t ? 'conq' : 'func');
      if (wd === 5) { st(3, 12.5, 'comida'); if (R() < 0.5) st(3, 10 + R() * 5, 'conq'); }
      if (wd === 6 && R() < 0.4) st(3, 11 + R(), 'nota');

      if (R() < 0.6) st(0, 19 + R(), 'comida');
      if (R() < 0.3) st(0, 20.5 + R(), 'nota');
      if (R() < 0.25) st(0, 18 + R() * 3, 'func');
      if (R() < 0.1 + 0.35 * t) st(0, 18 + R() * 3, 'conq');

      total += stitches.length;
      rows.push({
        n: d,
        bases: LANE.map((y, l) => ({ top: y - 0.5, color: COLORS[l] })),
        segs: segs,
        stitches: stitches
      });
    }
    const warps = [];
    for (let k = 0; k <= 8; k++) warps.push({ left: 44 + k * 107.5 });
    return { rows: rows, warps: warps, total: total };
  }
}
</script>
</body>
</html>
